<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页知译 · 图片文字识别</title><link rel="stylesheet" href="../pdf/reader.css"><link rel="stylesheet" href="reader.css"><link rel="stylesheet" href="../core/translation-style.css"></head><body>
<header><strong>页知译 · 图片文字识别</strong><button id="settings">翻译服务设置</button></header><main>
<section class="source-panel"><form id="sourceForm"><label for="sourceUrl">在线图片地址</label><div class="source-row"><input id="sourceUrl" type="url" placeholder="https://example.com/image.png"><button>读取在线图片</button><label class="file-button">选择图片<input id="localFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif"></label></div></form><p class="hint">也可粘贴剪贴板中的图片。最大 20 MB，过大图片会缩小。识别在本机完成；校对后点击“翻译文字”，仅文字发送至所选翻译服务。支持印刷体英文、简体中文，手写及复杂版式可能识别不准。</p></section>
<section class="controls"><label>识别语言<select id="ocrLanguage"><option value="eng">英文</option><option value="chi_sim+eng">简体中文 + 英文</option></select></label><button id="recognize" disabled>识别图片文字</button><label>服务<select id="service"></select></label><label>源语言<select id="from"></select></label><label>目标语言<select id="to"></select></label><button id="translate" class="primary" disabled>翻译文字</button><button id="cancel" disabled>取消</button></section>
<div id="status" role="status" aria-live="polite">选择或粘贴图片，再点击识别。</div><section class="workspace"><article class="original-pane"><h1>原图</h1><div id="preview"></div></article><article class="translation-pane"><label for="sourceText">识别文字（请先校对，可编辑）</label><textarea id="sourceText" maxlength="100000" rows="12"></textarea><h2>译文</h2><p id="result" class="bt-translation-text" dir="auto"></p></article></section></main>
<script src="../core/md5.js"></script><script src="../core/constants.js"></script><script src="../core/providers.js"></script><script src="../core/translation-style.js"></script><script src="../core/pdf-document.js"></script><script src="../core/ocr-runtime.js"></script><script src="reader.js"></script></body></html>
