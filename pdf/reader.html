<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>页知译 · PDF 双语阅读</title>
  <link rel="stylesheet" href="../core/translation-style.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-icon">译</span><div><strong>页知译</strong><span>PDF 双语阅读</span></div></div>
    <button id="settings">翻译服务设置</button>
  </header>
  <main>
    <section class="source-panel" aria-label="打开 PDF">
      <form id="sourceForm"><label for="sourceUrl">在线 PDF 地址</label><div class="source-row"><input id="sourceUrl" type="url" placeholder="https://example.com/document.pdf" autocomplete="off"><button id="openUrl" type="submit">读取在线 PDF</button><label class="file-button" for="localFile">选择本地 PDF<input id="localFile" type="file" accept="application/pdf,.pdf"></label></div></form>
      <p class="hint">文件在浏览器本地解析，最大 50 MB。点击“开始翻译”后，仅文字发送至所选翻译服务。扫描图片中的文字暂不支持识别。</p>
    </section>
    <section class="controls" aria-label="阅读与翻译控制">
      <div class="paging"><button id="previous" disabled aria-label="上一页">上一页</button><label for="pageNumber">第 <input id="pageNumber" type="number" min="1" value="1" disabled> / <span id="pageCount">—</span> 页</label><button id="next" disabled aria-label="下一页">下一页</button></div>
      <label>服务<select id="service" aria-label="翻译服务"></select></label>
      <label>源语言<select id="from" aria-label="源语言"></select></label>
      <label>目标语言<select id="to" aria-label="目标语言"></select></label>
      <button id="translate" class="primary" disabled>开始翻译</button><button id="cancel" disabled>取消翻译</button>
    </section>
    <div id="status" role="status" aria-live="polite">选择 PDF，或填写在线 PDF 地址后读取。</div>
    <section id="workspace" class="workspace" aria-label="PDF 双语对照">
      <article class="original-pane"><div class="pane-heading"><h1>原 PDF</h1><span id="filename">尚未打开文件</span></div><div id="canvasContainer"><div id="emptyOriginal">保留原始版式，按页阅读</div><canvas id="pdfCanvas" hidden aria-label="当前 PDF 页"></canvas></div></article>
      <article class="translation-pane"><div class="pane-heading"><h2>本页译文</h2><span>翻页后继续翻译，取消后停止</span></div><div id="translations"><p class="empty">点击“开始翻译”，在这里查看原文与译文。</p></div></article>
    </section>
  </main>
  <script src="../core/md5.js"></script>
  <script src="../core/constants.js"></script>
  <script src="../core/translation-style.js"></script>
  <script src="../core/request-policy.js"></script>
  <script src="../core/providers.js"></script>
  <script src="../core/pdf-document.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
